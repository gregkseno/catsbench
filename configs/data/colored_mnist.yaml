_target_: src.data.ImageDataModule
dim: 32
num_categories: 256
batch_size: 128 # per device; Lightning shards the dataset across devices
val_batch_size: 25 # per device
num_train_batches: 20000
num_workers: 0
pin_memory: false
train_data_mode: encoded
eval_data_mode: encoded

codec:
  _target_: src.data.codec.raw.RawImageCodec
  num_categories: ${data.num_categories}

input_dataset:
  _target_: src.data.image_datamodule.DiscreteColoredMNISTDataset
  _partial_: true
  target_digit: 3
  data_dir: ${paths.data_dir}
  img_size: ${data.dim}

target_dataset:
  _target_: src.data.image_datamodule.DiscreteColoredMNISTDataset
  _partial_: true
  target_digit: 2
  data_dir: ${paths.data_dir}
  img_size: ${data.dim}
