# @package _global_

defaults:
  - override /data: colored_mnist
  - override /model: denoiser_image
  - override /method: alpha_csbm
  - override /callbacks:
    - model_checkpoint
    - model_summary
    - image_plotter
  - override /trainer: gpu
  - _self_

prior:
  alpha: 0.01
  eps: 1e-6
  prior_type: gaussian
  num_timesteps: 50
  num_skip_steps: 2

method:
  ema:
    decay: 0.9999
  optimizer:
    lr: 0.0002
  use_mini_batch: true
  num_first_iterations: 10
  kl_loss_coeff: 1.0
  ce_loss_coeff: 0.001
  mse_loss_coeff: 0
  ignore_index: -100
  argmax_mode: true

trainer:
  devices: 2
  max_epochs: 58
  limit_train_batches: 1.0
  val_check_interval: 1000
  accumulate_grad_batches: 1
  gradient_clip_val: null
