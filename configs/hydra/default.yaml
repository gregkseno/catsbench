# @package hydra

job:
  chdir: false
run:
  dir: ${get_run_directory_from_checkpoint:${ckpt_path},${paths.log_dir}/runs/${hydra:runtime.choices.experiment}/${seed}/${now:%Y-%m-%d}_${now:%H-%M-%S}}
sweep:
  dir: ${paths.log_dir}/runs
  subdir: ${get_run_directory_from_checkpoint:${ckpt_path},${hydra:runtime.choices.experiment}/${seed}/${now:%Y-%m-%d}_${now:%H-%M-%S},${hydra.sweep.dir}}
job_logging:
  handlers:
    file:
      filename: ${hydra:runtime.output_dir}/${task_name}.log
